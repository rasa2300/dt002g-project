name: Build app

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up OpenJDK
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Build with Maven
      run: mvn package
    
    - name: Upload output as artifact
      uses: actions/upload-artifact@v4
      with:
          name: app-output
          path: target/notes-1.0-SNAPSHOT.jar
